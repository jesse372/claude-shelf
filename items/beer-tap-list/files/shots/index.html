<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap List app — screens</title>
<meta name="theme-color" content="#f3f3f5">
<link rel="icon" href="../favicon.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f3f3f5;color:#111114;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:18px 14px 40px}
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
  p.sub{color:#6e6e76;font-size:14px;margin-bottom:18px}
  p.sub a{color:#8a5a0c}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  figure{background:#fff;border:1px solid #e4e4e9;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
  figure img{width:100%;height:auto;border-radius:10px;display:block;background:#f3f3f5;border:1px solid #e4e4e9}
  figcaption{font-size:14px;line-height:1.35;color:#6e6e76}
  figcaption b{display:block;color:#111114;margin-bottom:2px}
  .wide{grid-column:1 / -1}
</style>
</head>
<body>
<h1>Taps — the app</h1>
<p class="sub">Live at <a href="../edit.html">jesse372.github.io/beer-tap-list/edit.html</a>. On an iPhone: Safari → Share → Add to Home Screen.</p>
<div class="grid">
  <figure><img src="1-beers.png" alt=""><figcaption><b>Beers</b>One row per beer with its colour, style, ABV and status. The + in the header adds a beer. The publish bar stays quiet while everything matches the TV.</figcaption></figure>
  <figure><img src="2-open-beer.png" alt=""><figcaption><b>Open a beer</b>Pouring / Kicked / Coming soon comes first, then name, style, ABV and IBU.</figcaption></figure>
  <figure><img src="3-kicked-unpublished.png" alt=""><figcaption><b>Kick a keg</b>One tap. The row strikes through and the publish bar grows into a full-width Publish with Undo.</figcaption></figure>
  <figure><img src="4-more-details.png" alt=""><figcaption><b>More details</b>Notes, icon, colour, picture and prices fold away until needed.</figcaption></figure>
  <figure><img src="5-screen-tab.png" alt=""><figcaption><b>Screen tab</b>TV preview, print menu, screen settings, food &amp; merch.</figcaption></figure>
  <figure><img src="6-tvs-tab.png" alt=""><figcaption><b>TVs tab</b>The hourly gag switch and the laugh button, with the Telly page a tap away.</figcaption></figure>
  <figure><img src="7-telly.png" alt=""><figcaption><b>TVs page</b>Hours for the hourly gag, next gag, jumble, write a line, show a photo.</figcaption></figure>
  <figure class="wide"><img src="8-desktop.png" alt=""><figcaption><b>Laptop</b>Same card order and status control; everything on one page as before.</figcaption></figure>
</div>
</body>
</html>
