name = "ontap-publish"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Secrets (set with `wrangler secret put`, never committed):
#   APP_PASSWORD  - what he types to sign in
#   GH_TOKEN      - the GitHub fine-grained token, now server-side only
#   GH_OWNER / GH_REPO / GH_BRANCH are plain vars below.
[vars]
GH_OWNER = "jesse372"
GH_REPO = "beer-tap-list"
GH_BRANCH = "main"
ALLOWED_ORIGIN = "https://jesse372.github.io"

# Signalling channel for the "Want a laugh?" button (laptop -> TV).
[[kv_namespaces]]
binding = "SIGNAL"
id = "7dd65713fe9b4571a451abbd7e6031df"
