<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AnotherLife</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="description" content="A life simulator. Born at random, dead by default. Everything in between is up to you.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AnotherLife">
<meta name="theme-color" content="#f8f3ea" id="meta-theme">
<meta name="color-scheme" content="light dark">
<script>/* before first paint, so switching themes never flashes the other one */
try{if(localStorage.getItem("anotherlife.theme")==="dark"){
  document.documentElement.setAttribute("data-theme","dark");
}}catch(e){}</script>
<script>/* ---------- last-resort boot guard ----------
   The in-app crash screen lives in main.js, so it cannot help if main.js
   itself never finishes evaluating — a bad import, a parse error on an older
   WebView, a module that throws at load. That leaves a white screen with no
   error, no way back, and nothing to report. This runs first, captures
   whatever went wrong, and if the app has not signalled that it booted,
   replaces the blank page with something that says what happened and offers
   a way out that does not cost the player their save. */
(function(){
  var problems = [];
  function note(m){ if(m) problems.push(String(m).slice(0,300)); }
  window.addEventListener("error", function(e){
    note(e && (e.message || e.type) + (e && e.filename ? "  [" + e.filename.split("/").pop() + ":" + e.lineno + "]" : ""));
  }, true);
  window.addEventListener("unhandledrejection", function(e){ note(e && e.reason && (e.reason.message || e.reason)); });
  window.__alBooted = false;
  setTimeout(function(){
    if (window.__alBooted) return;
    var msg = problems.length ? problems.join("\n") : "The app stopped loading before it could start, and did not say why.";
    document.body.innerHTML =
      '<div style="font:15px/1.6 -apple-system,system-ui,sans-serif;color:#2b241b;background:#f8f3ea;'
      + 'min-height:100vh;padding:28px 20px;-webkit-font-smoothing:antialiased">'
      + '<h1 style="font:400 22px/1.3 ui-serif,Georgia,serif;margin:0 0 10px">AnotherLife didn\'t start</h1>'
      + '<p style="color:#796e5e;margin:0 0 18px">Your saved life is still on the device. This screen is the bug.</p>'
      + '<pre style="white-space:pre-wrap;word-break:break-word;background:#f0e8d8;border:1px solid #e0d5c0;'
      + 'border-radius:8px;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#8a3a24">'
      + msg.replace(/[<>&]/g, function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c];}) + '</pre>'
      + '<button id="al-reload" style="width:100%;padding:15px;margin-top:14px;border:0;border-radius:10px;'
      + 'background:#e9a13c;color:#241a08;font:700 16px inherit">Try again</button>'
      + '<button id="al-reset" style="width:100%;padding:15px;margin-top:10px;border:1px solid #e0d5c0;'
      + 'border-radius:10px;background:transparent;color:#796e5e;font:600 15px inherit">Reset the app (keeps nothing)</button>'
      + '</div>';
    document.getElementById("al-reload").onclick = function(){ location.reload(); };
    document.getElementById("al-reset").onclick = function(){
      try { localStorage.clear(); } catch(e){}
      location.reload();
    };
  }, 4000);
})();</script>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

<!-- ================= TITLE / NEW LIFE ================= -->
<section id="screen-title" class="screen active">
  <div class="title-wrap">
    <div class="title-mark" id="title-mark"></div>
    <h1 class="title">Anotherlife</h1>
    <p class="tagline">Born at random. Dead by default.<br>Everything in between is up to you.</p>
    <div class="title-actions">
      <button class="btn btn-primary btn-lg" id="btn-new">Start a New Life</button>
      <button class="btn btn-ghost" id="btn-continue" hidden>Continue Your Life</button>
      <button class="btn btn-ghost" id="btn-custom">Custom Character</button>
      <button class="btn btn-ghost" id="btn-graveyard">Graveyard</button>
    </div>
  </div>
</section>

<!-- ================= MAIN GAME ================= -->
<section id="screen-game" class="screen">
  <!-- One slim line: who you are, how old, what you're worth. Tap it for
       the full dossier. Everything else on this screen is your life. -->
  <div class="idbar">
    <button class="idbar-menu" id="btn-menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="idbar-main" id="btn-status" aria-label="Your details">
      <span class="id-top">
        <span class="id-name"><span id="hdr-flag"></span><span id="hdr-name">—</span></span>
        <span class="id-age" id="hdr-age">0</span>
        <span class="id-money" id="hdr-money">$0</span>
        <span class="id-chev" aria-hidden="true">▾</span>
      </span>
      <span class="id-sub" id="hdr-sub">—</span>
    </button>
    <button class="brand-dev" id="btn-dev" hidden>DEV ⟳</button>
    <span class="brand-gen" id="hdr-gen" hidden></span>
  </div>

  <div class="statribbon" id="stats"></div>
  <div class="warnstrip" id="warnstrip" hidden></div>

  <main class="feed" id="feed"></main>

  <div class="agebar">
    <button class="age-btn" id="btn-age">
      <span class="age-word">Live another year</span>
      <span class="age-plus">›</span>
    </button>
  </div>

  <nav class="nav">
    <button class="nav-btn" data-tab="occupation" aria-label="Work"><span class="ni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7.5" width="18" height="12.5" rx="2"/><path d="M8.8 7.5V5.6A1.6 1.6 0 0 1 10.4 4h3.2a1.6 1.6 0 0 1 1.6 1.6v1.9M3 13h18"/></svg>
    </span><em>Work</em></button>
    <button class="nav-btn" data-tab="assets" aria-label="Estate"><span class="ni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20v-9.2L12 4.4l8 6.4V20M9.6 20v-5.2h4.8V20"/></svg>
    </span><em>Estate</em></button>
    <button class="nav-btn" data-tab="relationships" aria-label="People"><span class="ni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.2" cy="8.6" r="3.2"/><path d="M3.4 19.6c0-3.2 2.6-5.4 5.8-5.4s5.8 2.2 5.8 5.4"/><path d="M16 5.9a2.8 2.8 0 0 1 0 5.5M17.2 14.6c2.1.6 3.4 2.4 3.4 5"/></svg>
    </span><em>People</em></button>
    <button class="nav-btn" data-tab="activities" aria-label="Do"><span class="ni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 13.7 10.3 20.8 12 13.7 13.7 12 20.8 10.3 13.7 3.2 12 10.3 10.3Z"/></svg>
    </span><em>Do</em></button>
  </nav>
</section>

<!-- ================= SHEET (bottom drawer) ================= -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <h2 id="sheet-title">—</h2>
      <button class="sheet-close" id="sheet-close" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<!-- ================= MODAL (choices / results) ================= -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ================= TOAST ================= -->
<div class="toast" id="toast" hidden></div>

<!-- ============ EFFECTS OVERLAY (pointer-events:none) ============ -->
<div class="fx" id="fx" aria-hidden="true"></div>

<script type="module" src="js/main.js?v=6"></script>
</body>
</html>
