name = "luxe-lash-studio"
main = "src/worker.js"
compatibility_date = "2026-07-01"
workers_dev = true

[build]
command = "python3 build.py"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# The photo queue: one SQLite-backed Durable Object (free plan, no R2 needed).
[[durable_objects.bindings]]
name = "QUEUE"
class_name = "Queue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Queue"]

[observability]
enabled = true

# Secrets (`npx wrangler secret put NAME`, never committed):
#   ACCESS_CODE  - the code Bec types once on her phone
#   AGENT_TOKEN  - shared with the Mac mini agent (agent/.agent_token)
